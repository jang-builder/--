<!--
  [아임웹 사용법]
  1. 아임웹 에디터에서 홈페이지 맨 위에 "HTML 위젯"(또는 "코드 위젯")을 추가하세요.
  2. 이 파일 전체를 복사해서 위젯 편집창에 그대로 붙여넣으세요.
  3. 위젯 높이를 500px 이상으로 넉넉하게 설정해주세요.
  4. 아래 "온라인 예약하기" 버튼의 href="#reservation" 은, 아임웹에서 예약 섹션을 만든 뒤
     그 섹션의 실제 앵커(#로 시작하는 주소)로 바꿔주세요.
-->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
.mgw-hero{position:relative;font-family:'Gowun Dodum',sans-serif;min-height:560px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#CDEDE3 0%,#EAF7EF 45%,#FFF8F0 100%);
  overflow:hidden;text-align:center;padding:60px 20px;border-radius:0;}
.mgw-hero *{box-sizing:border-box;margin:0;padding:0;text-decoration:none;list-style:none;border:0;font-style:normal;}
.mgw-hero-sky{position:absolute;inset:0;z-index:1;}
.mgw-cloud{position:absolute;background:#fff;border-radius:50px;opacity:.8;animation:mgwDrift 30s linear infinite;}
.mgw-cloud::before,.mgw-cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;}
.mgw-c1{width:90px;height:32px;top:10%;left:-120px;}
.mgw-c1::before{width:45px;height:45px;top:-22px;left:10px;}
.mgw-c1::after{width:35px;height:35px;top:-16px;left:45px;}
.mgw-c2{width:70px;height:26px;top:20%;left:-100px;animation-duration:42s;animation-delay:6s;}
.mgw-c2::before{width:35px;height:35px;top:-16px;left:8px;}
.mgw-c2::after{width:26px;height:26px;top:-12px;left:34px;}
@keyframes mgwDrift{from{transform:translateX(0);}to{transform:translateX(140vw);}}
.mgw-scene{position:relative;width:100%;max-width:520px;height:200px;margin:0 auto 10px;z-index:2;}
.mgw-grass{position:absolute;bottom:0;left:0;right:0;height:26px;background:#8FD6B8;border-radius:50% 50% 0 0/100% 100% 0 0;}
.mgw-pet{position:absolute;width:150px;bottom:20px;}
.mgw-pet svg{width:100%;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.08));}
.mgw-pet.mgw-dog{left:8%;animation:mgwBounce 2.4s ease-in-out infinite;}
.mgw-pet.mgw-cat{right:8%;animation:mgwBounce 2.4s ease-in-out infinite;animation-delay:.6s;}
@keyframes mgwBounce{0%,100%{transform:translateY(0) rotate(0deg);}25%{transform:translateY(-16px) rotate(-3deg);}50%{transform:translateY(0) rotate(0deg);}75%{transform:translateY(-8px) rotate(3deg);}}
.mgw-blink{animation:mgwBlink 4s infinite;}
@keyframes mgwBlink{0%,92%,100%{transform:scaleY(1);}96%{transform:scaleY(.1);}}
.mgw-tail{animation:mgwWag 1s ease-in-out infinite;}
@keyframes mgwWag{0%,100%{transform:rotate(30deg);}50%{transform:rotate(55deg);}}
.mgw-tailcat{animation:mgwWagCat 2s ease-in-out infinite;transform-origin:60px 90px;}
@keyframes mgwWagCat{0%,100%{transform:rotate(-20deg);}50%{transform:rotate(-45deg);}}
.mgw-text{position:relative;z-index:2;}
.mgw-eyebrow{color:#3A9C88;font-weight:700;letter-spacing:2px;font-size:.85rem;margin-bottom:10px;}
.mgw-text h1{font-family:'Jua',sans-serif;font-size:2.2rem;margin-bottom:16px;color:#2E3238;line-height:1.4;}
.mgw-sub{color:#6B7278;font-size:1.02rem;margin-bottom:24px;}
.mgw-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.mgw-btn{display:inline-block;padding:14px 26px;border-radius:50px;font-weight:700;text-decoration:none;}
.mgw-btn-primary{background:#FF8C6B;color:#fff;box-shadow:0 8px 20px rgba(255,140,107,.35);}
.mgw-btn-ghost{background:#fff;color:#2E3238;border:2px solid #EDE6DA;}
</style>

<div class="mgw-hero">
  <div class="mgw-hero-sky">
    <div class="mgw-cloud mgw-c1"></div>
    <div class="mgw-cloud mgw-c2"></div>
  </div>

  <div class="mgw-scene">
    <div class="mgw-pet mgw-dog">
      <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="120" rx="55" ry="30" fill="#F2B183"/>
        <circle cx="70" cy="70" r="38" fill="#F2B183"/>
        <ellipse cx="45" cy="45" rx="14" ry="22" fill="#E89A5C" transform="rotate(-25 45 45)"/>
        <ellipse cx="95" cy="45" rx="14" ry="22" fill="#E89A5C" transform="rotate(25 95 45)"/>
        <circle cx="58" cy="68" r="5" fill="#3A2C22" class="mgw-blink"/>
        <circle cx="82" cy="68" r="5" fill="#3A2C22" class="mgw-blink"/>
        <ellipse cx="70" cy="84" rx="8" ry="6" fill="#3A2C22"/>
        <path d="M55 92 Q70 102 85 92" stroke="#3A2C22" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse class="mgw-tail" cx="150" cy="110" rx="10" ry="22" fill="#F2B183" transform="rotate(30 150 110)"/>
      </svg>
    </div>
    <div class="mgw-pet mgw-cat">
      <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="122" rx="50" ry="26" fill="#B9B4E0"/>
        <circle cx="130" cy="72" r="34" fill="#B9B4E0"/>
        <polygon points="108,48 118,20 128,50" fill="#B9B4E0"/>
        <polygon points="150,48 160,20 168,52" fill="#B9B4E0"/>
        <circle cx="120" cy="72" r="4.5" fill="#2E2A44" class="mgw-blink"/>
        <circle cx="140" cy="72" r="4.5" fill="#2E2A44" class="mgw-blink"/>
        <path d="M128 82 L132 86 L136 82" stroke="#2E2A44" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse class="mgw-tailcat" cx="55" cy="115" rx="9" ry="30" fill="#B9B4E0" transform="rotate(-20 55 115)"/>
      </svg>
    </div>
    <div class="mgw-grass"></div>
  </div>

  <div class="mgw-text">
    <p class="mgw-eyebrow">MONGL ANIMAL HOSPITAL</p>
    <h1>우리 아이가<br>편안하게 웃는 병원</h1>
    <p class="mgw-sub">진료비는 투명하게, 진료는 정성스럽게.<br>몽글동물병원이 함께합니다.</p>
    <div class="mgw-btns">
      <a href="#reservation" class="mgw-btn mgw-btn-primary">온라인 예약하기</a>
      <a href="#fees" class="mgw-btn mgw-btn-ghost">진료비 확인하기</a>
    </div>
  </div>
</div>
